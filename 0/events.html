<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="تصفّح الفعاليات الجامعية وفلترها حسب التصنيف والتاريخ والمكان."><title>كل الفعاليات | دليل الفعاليات</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="assets/css/styles.css" rel="stylesheet"></head>
<body><div id="site-header"></div><main class="container page-wrap">
  <section class="page-hero"><span class="eyebrow">مساحتك للاكتشاف</span><h1>كل الفعاليات، <span>في مكان واحد.</span></h1><p>ابحث، صفِّ النتائج، واختر التجربة التي تناسب وقتك واهتماماتك.</p></section>
  <section class="filter-panel">
    <div class="filter-top"><div><h2>استكشف الفعاليات</h2><p id="resultCount" class="muted mb-0">جارٍ تحميل الفعاليات…</p></div><button class="btn btn-outline-secondary" id="resetFilters">إعادة ضبط الفلاتر</button></div>
    <div class="row g-3 mt-1">
      <div class="col-md-6 col-lg-4"><label for="searchInput" class="form-label">بحث بالكلمات</label><input class="form-control" id="searchInput" placeholder="مثلاً: ورشة، موسيقى، حوار…"></div>
      <div class="col-md-6 col-lg-2"><label for="categoryFilter" class="form-label">التصنيف</label><select class="form-select" id="categoryFilter"><option value="">كل التصنيفات</option><option value="culture">ثقافة ومعرفة</option><option value="sport">رياضة ونشاط</option><option value="music">فن وموسيقى</option><option value="social">مجتمع وطلاب</option></select></div>
      <div class="col-md-4 col-lg-2"><label for="dateFilter" class="form-label">الفترة</label><select class="form-select" id="dateFilter"><option value="">كل الفترات</option><option value="upcoming">القادمة فقط</option><option value="today">اليوم</option></select></div>
      <div class="col-md-4 col-lg-2"><label for="exactDateFilter" class="form-label">تاريخ محدد</label><input class="form-control" id="exactDateFilter" type="date" aria-label="تصفية حسب تاريخ محدد"></div>
      <div class="col-md-4 col-lg-2"><label for="locationFilter" class="form-label">المكان</label><select class="form-select" id="locationFilter"><option value="">كل الأماكن</option><option>دمشق / عبر الإنترنت</option><option>دمشق</option><option>حمص</option><option>اللاذقية</option><option>حلب</option><option>طرطوس</option></select></div>
    </div>
  </section>
  <section class="section-space pt-4"><div class="row g-4" id="allEvents"></div><div class="empty-state d-none" id="emptyState"><span>🔎</span><h3>لم نعثر على نتائج</h3><p>جرّب تغيير كلمات البحث أو خيارات التصفية.</p></div></section>
</main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script></body></html>
